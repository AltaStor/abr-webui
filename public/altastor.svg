<!-- Favicon only. The viewBox is inset 2 units on every side, scaling the mark
     ~6% against a tab's 16px slot: the hexagon is taller than it is wide and
     already spans the full height at 0 0 73 73, so the frame is the only place
     left to take size from. The two vertices lose ~0.5px at real size, which no
     tab renders. Do not copy this inset into the in-app mark
     (src/assets/brand/altastor-mark.svg), which is laid out, not fitted. -->
