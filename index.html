<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/altastor.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0C1013" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#EEF3F6" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="AltaStor — free, open-source VMware backup & replication. Sealed in stone: immutable, recoverable, and run on your own servers."
    />
    <!-- Brand type: Chakra Petch (headings, labels, numerals) + IBM Plex Sans
         (body, captions) + JetBrains Mono (data tokens, terminal). All three are
         self-hosted via @fontsource in src/styles/globals.css — the appliance
         ships air-gapped, so a font CDN would render nothing. -->
    <title>AltaStor · Backup &amp; Replication</title>
    <!-- Theme, before first paint. The <html> class above is the product
         default (dark); this restores an explicit choice made earlier, from the
         same localStorage key the UI store writes (see src/store/ui.ts). It has
         to run here, synchronously in <head>, rather than when that module
         loads: by then the page has already painted, and a light-theme session
         would flash the dark ground on every reload. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("basalt.theme");
          if (t !== "light" && t !== "dark") return;
          var r = document.documentElement;
          r.classList.toggle("dark", t === "dark");
          r.classList.toggle("light", t === "light");
          r.style.colorScheme = t;
        } catch (e) {
          /* storage disabled — the default in the class attribute stands */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
